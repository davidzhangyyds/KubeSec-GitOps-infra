apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesec-app
  labels:
    app: kubesec-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubesec-app
  template:
    metadata:
      labels:
        app: kubesec-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: web
        image: bash
        command: ["sleep", "3600"]
        securityContext:
          allowPrivilegeEscalation: false